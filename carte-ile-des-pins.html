<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte de l’Île des Pins — Commune de Kunié</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: "Public Sans", system-ui, sans-serif; }
  #carte { width: 100%; height: 100%; min-height: 420px; }
  .leaflet-container { background: #DCE8E3; }
  .etiquette { font-size: 14px; line-height: 1.45; }
  .etiquette strong { color: #0E3B3E; display: block; font-size: 15px; }
</style>
</head>
<body>
<div id="carte" role="application" aria-label="Carte interactive de l’Île des Pins avec les baies et les services de la commune"></div>
<script>
  var carte = L.map('carte', { scrollWheelZoom: false }).setView([-22.625, 167.480], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 17
  }).addTo(carte);

  var lieux = [
    { c: [-22.6742, 167.4869], n: 'Mairie de l’Île des Pins', d: 'Vao — accueil du public, lundi à vendredi' },
    { c: [-22.6543, 167.4413], n: 'Baie de Kuto', d: 'Plage, débarcadère des liaisons maritimes' },
    { c: [-22.6597, 167.4462], n: 'Baie de Kanuméra', d: 'Rocher sacré — accès interdit à l’escalade' },
    { c: [-22.6155, 167.5310], n: 'Piscine naturelle d’Oro', d: 'Site fragile, accès à pied par la forêt' },
    { c: [-22.6120, 167.5075], n: 'Baie d’Upi', d: 'Départ des pirogues traditionnelles' },
    { c: [-22.6280, 167.4930], n: 'Baie de Saint-Joseph', d: 'Village et bord de mer' },
    { c: [-22.5889, 167.4564], n: 'Aérodrome de Moué', d: 'Liaisons quotidiennes avec Nouméa Magenta' }
  ];

  lieux.forEach(function (l) {
    L.circleMarker(l.c, {
      radius: 9, color: '#0E3B3E', weight: 2, fillColor: '#C9A961', fillOpacity: 1
    }).addTo(carte).bindPopup('<div class="etiquette"><strong>' + l.n + '</strong>' + l.d + '</div>');
  });

  carte.fitBounds(lieux.map(function (l) { return l.c; }), { padding: [40, 40] });
</script>
</body>
</html>
